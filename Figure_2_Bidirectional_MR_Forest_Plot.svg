  <text x="140" y="1250" font-family="Arial" font-size="24" fill="#7F8C8D">Estimates are per one log-odds increase in genetically predicted liability to the exposure. Instruments were clumped against the 1000 Genomes European reference panel.</text>
  <text x="140" y="1290" font-family="Arial" font-size="24" fill="#7F8C8D">Box area is proportional to the inverse-variance weight (1/SE²); horizontal bars denote 95% confidence intervals. The dashed vertical line marks the null (OR = 1).</text>
  <text x="140" y="1330" font-family="Arial" font-size="24" fill="#7F8C8D">MDD, major depressive disorder; OR, odds ratio; CI, confidence interval; SNP, single-nucleotide polymorphism.</text>
