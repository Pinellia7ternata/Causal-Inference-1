<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2600 2000" width="2600" height="2000">
  <!-- Figure 4: Shared Genetic Architecture - Fixed color legend matching -->
  
  <rect x="0" y="0" width="2600" height="2000" fill="white"/>
  
  <!-- ==================== TITLE ==================== -->
  <text x="1300" y="80" font-family="Arial" font-size="40" font-weight="bold" fill="#1A5276" text-anchor="middle">Supplementary Figure S5</text>
  <text x="1300" y="140" font-family="Arial" font-size="30" fill="#2C3E50" text-anchor="middle">Shared genetic architecture between MDD and anxiety disorders</text>

  <!-- ============================================================ -->
  <!-- PANEL A: Colocalization Donut Chart (Left-Top)              -->
  <!-- ============================================================ -->
  <text x="550" y="240" font-family="Arial" font-size="32" font-weight="bold" fill="#1A5276" text-anchor="middle">Panel A: Colocalization</text>
  <text x="550" y="275" font-family="Arial" font-size="24" fill="#717D7E" text-anchor="middle">(375 independent loci tested)</text>

  <!-- Donut: outer r=180, inner r=100, center at (550, 500) -->
  <!-- Full circle gray (PP.H4 ≤ 0.5) -->
  <circle cx="550" cy="500" r="180" fill="#BDC3C7"/>
  <!-- Green arc for PP.H4 > 0.5 (48% = 172.8°) -->
  <!-- Using path: start at top (550,320), arc clockwise -->
  <path d="M 550 320 A 180 180 0 1 1 380.3 604.4 L 452.4 555.8 A 100 100 0 1 0 550 400 Z" fill="#27AE60"/>
  <!-- Inner white circle -->
  <circle cx="550" cy="500" r="100" fill="white"/>
  <!-- Center text -->
  <text x="550" y="485" font-family="Arial" font-size="48" font-weight="bold" fill="#2C3E50" text-anchor="middle">375</text>
  <text x="550" y="530" font-family="Arial" font-size="30" fill="#2C3E50" text-anchor="middle">Loci</text>

  <!-- Donut labels with lines -->
  <line x1="700" y1="380" x2="780" y2="340" stroke="#27AE60" stroke-width="2"/>
  <text x="790" y="330" font-family="Arial" font-size="22" font-weight="bold" fill="#27AE60">PP.H4 &gt; 0.5</text>
  <text x="790" y="358" font-family="Arial" font-size="22" fill="#2C3E50">180 loci (48%)</text>
  
  <line x1="380" y1="620" x2="300" y2="660" stroke="#717D7E" stroke-width="2"/>
  <text x="140" y="650" font-family="Arial" font-size="22" font-weight="bold" fill="#717D7E">PP.H4 ≤ 0.5</text>
  <text x="140" y="678" font-family="Arial" font-size="22" fill="#2C3E50">195 loci (52%)</text>

  <!-- ============================================================ -->
  <!-- PANEL B: LDSC Genetic Correlation (Right-Top)               -->
  <!-- ============================================================ -->
  <text x="1950" y="240" font-family="Arial" font-size="32" font-weight="bold" fill="#1A5276" text-anchor="middle">Panel B: LDSC Genetic Correlation</text>

  <!-- Big result box -->
  <rect x="1550" y="300" width="800" height="350" rx="25" ry="25" fill="#2471A3" stroke="#1A5276" stroke-width="5"/>
  <text x="1950" y="420" font-family="Arial" font-size="80" font-weight="bold" fill="white" text-anchor="middle">rg = 0.90</text>
  <text x="1950" y="500" font-family="Arial" font-size="36" fill="#D6EAF8" text-anchor="middle">SE = 0.032</text>
  <text x="1950" y="580" font-family="Arial" font-size="40" font-weight="bold" fill="#FADBD8" text-anchor="middle">P = &lt; 1 × 10⁻¹⁰⁰</text>

  <!-- Interpretation -->
  <text x="1950" y="710" font-family="Arial" font-size="24" fill="#717D7E" text-anchor="middle" font-style="italic">Strong positive genetic correlation</text>

  <!-- ============================================================ -->
  <!-- PANEL C: Colocalization Summary Table (Left-Bottom)         -->
  <!-- ============================================================ -->
  <text x="550" y="820" font-family="Arial" font-size="32" font-weight="bold" fill="#1A5276" text-anchor="middle">Panel C: Colocalization Summary</text>

  <!-- Table -->
  <!-- Header -->
  <rect x="100" y="860" width="900" height="60" rx="8" ry="8" fill="#1A5276"/>
  <text x="240" y="900" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">PP.H4 Threshold</text>
  <text x="600" y="900" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Loci (n)</text>
  <text x="860" y="900" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Percentage</text>

  <!-- Row 1: PP.H4 > 0.95 -->
  <rect x="100" y="925" width="900" height="55" rx="5" ry="5" fill="#E8F8F5"/>
  <text x="240" y="960" font-family="Arial" font-size="24" font-weight="bold" fill="#27AE60" text-anchor="middle">PP.H4 &gt; 0.95</text>
  <text x="600" y="960" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">11</text>
  <text x="860" y="960" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">2.9%</text>

  <!-- Row 2: PP.H4 > 0.7 -->
  <rect x="100" y="985" width="900" height="55" rx="5" ry="5" fill="white"/>
  <text x="240" y="1020" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">PP.H4 &gt; 0.7</text>
  <text x="600" y="1020" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">85</text>
  <text x="860" y="1020" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">22.7%</text>

  <!-- Row 3: PP.H4 > 0.5 -->
  <rect x="100" y="1045" width="900" height="55" rx="5" ry="5" fill="#E8F8F5"/>
  <text x="240" y="1080" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">PP.H4 &gt; 0.5</text>
  <text x="600" y="1080" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">180</text>
  <text x="860" y="1080" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">48.0%</text>

  <!-- ============================================================ -->
  <!-- PANEL D: Functional Annotation (Right-Bottom)               -->
  <!-- Colors: Blue=MDD, Red=Anxiety, Green=Shared                 -->
  <!-- ============================================================ -->
  <text x="1950" y="820" font-family="Arial" font-size="32" font-weight="bold" fill="#1A5276" text-anchor="middle">Panel D: Functional Annotation</text>

  <!-- Table Header -->
  <rect x="1400" y="860" width="1100" height="60" rx="8" ry="8" fill="#1A5276"/>
  <text x="1530" y="900" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Category</text>
  <text x="1750" y="900" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">MDD</text>
  <text x="1970" y="900" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Anxiety</text>
  <text x="2250" y="900" font-family="Arial" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Shared</text>

  <!-- Row 1: Lead SNPs -->
  <rect x="1400" y="925" width="1100" height="55" rx="5" ry="5" fill="#EBF5FB"/>
  <text x="1530" y="960" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">Lead SNPs</text>
  <text x="1750" y="960" font-family="Arial" font-size="24" font-weight="bold" fill="#2471A3" text-anchor="middle">327</text>
  <text x="1970" y="960" font-family="Arial" font-size="24" font-weight="bold" fill="#A93226" text-anchor="middle">68</text>
  <text x="2250" y="960" font-family="Arial" font-size="24" fill="#717D7E" text-anchor="middle">—</text>

  <!-- Row 2: Significant Genes -->
  <rect x="1400" y="985" width="1100" height="55" rx="5" ry="5" fill="white"/>
  <text x="1530" y="1020" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">Significant Genes</text>
  <text x="1750" y="1020" font-family="Arial" font-size="24" font-weight="bold" fill="#2471A3" text-anchor="middle">5,625</text>
  <text x="1970" y="1020" font-family="Arial" font-size="24" font-weight="bold" fill="#A93226" text-anchor="middle">3,627</text>
  <text x="2250" y="1020" font-family="Arial" font-size="24" font-weight="bold" fill="#27AE60" text-anchor="middle">2,128</text>
  <!-- Percentage annotation -->
  <text x="2250" y="1040" font-family="Arial" font-size="18" fill="#27AE60" text-anchor="middle">(58.7%)</text>

  <!-- Row 3: Pathways -->
  <rect x="1400" y="1050" width="1100" height="55" rx="5" ry="5" fill="#EBF5FB"/>
  <text x="1530" y="1085" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">Pathways</text>
  <text x="1750" y="1085" font-family="Arial" font-size="24" font-weight="bold" fill="#2471A3" text-anchor="middle">64</text>
  <text x="1970" y="1085" font-family="Arial" font-size="24" font-weight="bold" fill="#A93226" text-anchor="middle">23</text>
  <text x="2250" y="1085" font-family="Arial" font-size="24" font-weight="bold" fill="#27AE60" text-anchor="middle">18</text>

  <!-- Row 4: Brain eQTL Genes -->
  <rect x="1400" y="1110" width="1100" height="55" rx="5" ry="5" fill="white"/>
  <text x="1530" y="1145" font-family="Arial" font-size="24" fill="#2C3E50" text-anchor="middle">Brain eQTL Genes</text>
  <text x="1750" y="1145" font-family="Arial" font-size="24" font-weight="bold" fill="#2471A3" text-anchor="middle">252</text>
  <text x="1970" y="1145" font-family="Arial" font-size="24" font-weight="bold" fill="#A93226" text-anchor="middle">85</text>
  <text x="2250" y="1145" font-family="Arial" font-size="24" font-weight="bold" fill="#27AE60" text-anchor="middle">72</text>
  <text x="2250" y="1165" font-family="Arial" font-size="18" fill="#27AE60" text-anchor="middle">(84.7%)</text>

  <!-- ============================================================ -->
  <!-- LEGEND - Now matches actual colors in panels                 -->
  <!-- ============================================================ -->
  <rect x="400" y="1250" width="1800" height="80" rx="12" ry="12" fill="#F8F9F9" stroke="#BDC3C7" stroke-width="2"/>
  
  <!-- Blue = MDD -->
  <rect x="500" y="1272" width="30" height="30" rx="5" ry="5" fill="#2471A3"/>
  <text x="540" y="1295" font-family="Arial" font-size="24" fill="#2C3E50">MDD-specific</text>
  
  <!-- Red = Anxiety -->
  <rect x="900" y="1272" width="30" height="30" rx="5" ry="5" fill="#A93226"/>
  <text x="940" y="1295" font-family="Arial" font-size="24" fill="#2C3E50">Anxiety-specific</text>
  
  <!-- Green = Shared -->
  <rect x="1350" y="1272" width="30" height="30" rx="5" ry="5" fill="#27AE60"/>
  <text x="1390" y="1295" font-family="Arial" font-size="24" fill="#2C3E50">Shared / Overlap</text>
  
  <!-- Gray = Not significant -->
  <rect x="1750" y="1272" width="30" height="30" rx="5" ry="5" fill="#BDC3C7"/>
  <text x="1790" y="1295" font-family="Arial" font-size="24" fill="#2C3E50">Below threshold</text>

  <!-- Note -->
  <text x="1300" y="1410" font-family="Arial" font-size="22" fill="#717D7E" text-anchor="middle" font-style="italic">Note: Functional annotation results (Panel D) are exploratory and hypothesis-generating,</text>
  <text x="1300" y="1445" font-family="Arial" font-size="22" fill="#717D7E" text-anchor="middle" font-style="italic">requiring experimental validation. Shared percentages refer to overlap with Anxiety gene set.</text>

</svg>