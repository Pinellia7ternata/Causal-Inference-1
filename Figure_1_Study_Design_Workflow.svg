<text x="1200" y="365" font-family="Arial" font-size="30" fill="white" text-anchor="middle" font-weight="bold">GWAS Data Sources</text>
<text x="1200" y="415" font-family="Arial" font-size="24" fill="white" text-anchor="middle">MDD (PGC 2025, European-ancestry subset): 412,305 cases / 1,588,397 controls</text>
<text x="1200" y="460" font-family="Arial" font-size="24" fill="white" text-anchor="middle">Anxiety disorders (PGC 2026): 122,083 cases / 729,602 controls</text>
<line x1="1200" y1="500" x2="1200" y2="560" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="400" y="570" width="1600" height="130" rx="15" ry="15" fill="#2471A3" stroke="white" stroke-width="4"/>
<text x="1200" y="625" font-family="Arial" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Quality Control, Harmonization &amp; Ancestry Matching</text>
<text x="1200" y="670" font-family="Arial" font-size="22" fill="white" text-anchor="middle">European-ancestry subsets; 1000 Genomes European reference used for all reference-based steps</text>
<line x1="1200" y1="700" x2="1200" y2="760" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
