<text x="625" y="1100" font-family="Arial" font-size="27" fill="white" text-anchor="middle">198 SNPs</text>
<rect x="1350" y="990" width="850" height="140" rx="15" ry="15" fill="#2471A3" stroke="white" stroke-width="4"/>
<text x="1775" y="1055" font-family="Arial" font-size="28" fill="white" text-anchor="middle" font-weight="bold">Anxiety Instruments</text>
<text x="1775" y="1100" font-family="Arial" font-size="27" fill="white" text-anchor="middle">50 SNPs</text>
