<text x="1200" y="880" font-family="Arial" font-size="23" fill="white" text-anchor="middle">P &lt; 5 x 10^-8, r2 &lt; 0.001, 10,000 kb window</text>
<line x1="1200" y1="920" x2="1200" y2="980" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="200" y="990" width="850" height="140" rx="15" ry="15" fill="#2471A3" stroke="white" stroke-width="4"/>
