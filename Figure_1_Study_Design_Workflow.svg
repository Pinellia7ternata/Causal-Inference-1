<rect x="0" y="0" width="2400" height="3520" fill="white"/>
<text x="1200" y="110" font-family="Arial" font-size="48" fill="#1A5276" text-anchor="middle" font-weight="bold">Figure 1</text>
<text x="1200" y="175" font-family="Arial" font-size="30" fill="#2C3E50" text-anchor="middle">Study design and workflow of the bidirectional MR, instrument-strength and</text>
<text x="1200" y="220" font-family="Arial" font-size="30" fill="#2C3E50" text-anchor="middle">Steiger directionality assessment, MVMR, LDSC, colocalization, and functional annotation analyses</text>
