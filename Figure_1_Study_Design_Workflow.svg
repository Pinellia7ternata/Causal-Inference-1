<line x1="1775" y1="1130" x2="1775" y2="1190" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="200" y="1200" width="850" height="240" rx="15" ry="15" fill="#6C3483" stroke="white" stroke-width="4"/>
<text x="625.0" y="1242" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">MDD to Anxiety</text>
<text x="625.0" y="1286" font-family="Arial" font-size="23" fill="white" text-anchor="middle">F-statistics: all F &gt; 10 (mean 44.0)</text>
<text x="625.0" y="1330" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Steiger supports direction</text>
<text x="625.0" y="1374" font-family="Arial" font-size="23" fill="white" text-anchor="middle">P = 0.018</text>
<rect x="1350" y="1200" width="850" height="240" rx="15" ry="15" fill="#6C3483" stroke="white" stroke-width="4"/>
<text x="1775.0" y="1242" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">Anxiety to MDD</text>
<text x="1775.0" y="1286" font-family="Arial" font-size="23" fill="white" text-anchor="middle">F-statistics: all F &gt; 10 (mean 37.9)</text>
<text x="1775.0" y="1330" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Steiger supports direction</text>
<text x="1775.0" y="1374" font-family="Arial" font-size="23" fill="white" text-anchor="middle">P = 1.9 x 10^-95</text>
<line x1="625" y1="1440" x2="625" y2="1500" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<line x1="1775" y1="1440" x2="1775" y2="1500" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="150" y="1510" width="950" height="320" rx="15" ry="15" fill="#A93226" stroke="white" stroke-width="4"/>
<text x="625.0" y="1552" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">MDD to Anxiety MR</text>
<text x="625.0" y="1598" font-family="Arial" font-size="23" fill="white" text-anchor="middle">IVW, MR-Egger, Weighted Median</text>
<text x="625.0" y="1644" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Weighted Mode, Simple Mode</text>
<text x="625.0" y="1690" font-family="Arial" font-size="23" fill="white" text-anchor="middle">MR-PRESSO, Radial MR, MR-RAPS</text>
<text x="625.0" y="1736" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Cochran Q, Egger intercept</text>
<text x="625.0" y="1782" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Leave-one-out</text>
<rect x="1300" y="1510" width="950" height="320" rx="15" ry="15" fill="#A93226" stroke="white" stroke-width="4"/>
<text x="1775.0" y="1552" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">Anxiety to MDD MR</text>
<text x="1775.0" y="1598" font-family="Arial" font-size="23" fill="white" text-anchor="middle">IVW, MR-Egger, Weighted Median</text>
<text x="1775.0" y="1644" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Weighted Mode, Simple Mode</text>
<text x="1775.0" y="1690" font-family="Arial" font-size="23" fill="white" text-anchor="middle">MR-PRESSO, Radial MR, MR-RAPS</text>
<text x="1775.0" y="1736" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Cochran Q, Egger intercept</text>
<text x="1775.0" y="1782" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Leave-one-out</text>
<line x1="625" y1="1830" x2="625" y2="1890" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<line x1="1775" y1="1830" x2="1775" y2="1890" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="300" y="1900" width="1800" height="220" rx="15" ry="15" fill="#117864" stroke="white" stroke-width="4"/>
<text x="1200" y="1965" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">Sample Overlap Assessment &amp; MRlap Correction</text>
<text x="1200" y="2015" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Cross-trait LDSC intercept lambda = 0.256 (SE = 0.009)</text>
<text x="1200" y="2055" font-family="Arial" font-size="23" fill="white" text-anchor="middle">MRlap corrects for overlap + weak instruments + winner’s curse</text>
<text x="1200" y="2095" font-family="Arial" font-size="22" fill="white" text-anchor="middle">Corrected beta slightly larger: MDD to Anxiety 0.981 vs 0.876; Anxiety to MDD 0.627 vs 0.499 (P &lt; 1 x 10^-37)</text>
<line x1="1200" y1="2120" x2="1200" y2="2180" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="300" y="2190" width="1800" height="190" rx="15" ry="15" fill="#CA6F1E" stroke="white" stroke-width="4"/>
<text x="1200" y="2255" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">Multivariable MR (MVMR)</text>
<text x="1200" y="2300" font-family="Arial" font-size="23" fill="white" text-anchor="middle">3 covariates: BMI, education, smoking initiation</text>
<text x="1200" y="2345" font-family="Arial" font-size="23" fill="white" text-anchor="middle">MDD to Anxiety attenuated to OR = 1.15 (95% CI 1.09-1.22)</text>
<line x1="1200" y1="2380" x2="1200" y2="2440" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="400" y="2450" width="1600" height="150" rx="15" ry="15" fill="#1E8449" stroke="white" stroke-width="4"/>
<text x="1200" y="2515" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">Shared Genetic Architecture</text>
<text x="1200" y="2560" font-family="Arial" font-size="23" fill="white" text-anchor="middle">LDSC: rg = 0.90 (SE = 0.032)    |    Colocalization: 11 loci PP.H4 &gt; 0.95 (of 375)</text>
<line x1="1200" y1="2600" x2="1200" y2="2660" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="300" y="2670" width="1800" height="190" rx="15" ry="15" fill="#717D7E" stroke="white" stroke-width="4"/>
<text x="1200" y="2735" font-family="Arial" font-size="26" fill="white" text-anchor="middle" font-weight="bold">Exploratory Functional Annotation (hypothesis-generating)</text>
<text x="1200" y="2780" font-family="Arial" font-size="23" fill="white" text-anchor="middle">FUMA / MAGMA / Brain eQTL; Gene-set enrichment: synaptic, GABAergic, neurodevelopmental pathways</text>
<text x="1200" y="2825" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Drug-target candidates (colocalization loci): MCHR1, SORCS3, VRK2, FURIN</text>
<line x1="1200" y1="2860" x2="1200" y2="2920" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)"/>
<rect x="150" y="2930" width="950" height="340" rx="15" ry="15" fill="#1E8449" stroke="white" stroke-width="4"/>
<text x="625.0" y="2972" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">MDD to Anxiety</text>
<text x="625.0" y="3018" font-family="Arial" font-size="23" fill="white" text-anchor="middle">IVW OR = 2.34 (95% CI 2.23-2.46)</text>
<text x="625.0" y="3064" font-family="Arial" font-size="23" fill="white" text-anchor="middle">P = 1.66 x 10^-257</text>
<text x="625.0" y="3110" font-family="Arial" font-size="23" fill="white" text-anchor="middle">No directional pleiotropy</text>
<text x="625.0" y="3156" font-family="Arial" font-size="23" fill="white" text-anchor="middle">(Egger P = 0.864)</text>
<text x="625.0" y="3202" font-family="Arial" font-size="23" fill="white" text-anchor="middle">MRlap beta = 0.981 (vs 0.876)</text>
<rect x="1300" y="2930" width="950" height="340" rx="15" ry="15" fill="#CA6F1E" stroke="white" stroke-width="4"/>
<text x="1775.0" y="2972" font-family="Arial" font-size="27" fill="white" text-anchor="middle" font-weight="bold">Anxiety to MDD</text>
<text x="1775.0" y="3018" font-family="Arial" font-size="23" fill="white" text-anchor="middle">IVW OR = 1.68 (95% CI 1.60-1.76)</text>
<text x="1775.0" y="3064" font-family="Arial" font-size="23" fill="white" text-anchor="middle">P = 1.97 x 10^-104</text>
<text x="1775.0" y="3110" font-family="Arial" font-size="23" fill="white" text-anchor="middle">Directional pleiotropy</text>
<text x="1775.0" y="3156" font-family="Arial" font-size="23" fill="white" text-anchor="middle">(Egger P = 0.006)</text>
<text x="1775.0" y="3202" font-family="Arial" font-size="23" fill="white" text-anchor="middle">MRlap beta = 0.627 (vs 0.499)</text>
